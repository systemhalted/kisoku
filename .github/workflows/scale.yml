# Weekly scale verification: runs the gated `scale` and `memory` test tags at a
# CI-sized row count, so the PRD's measured claims (heap budget, per-evaluation
# working set, load and compile times) stay continuously verified instead of
# asserted in prose. Also runnable on demand via workflow_dispatch.

name: Scale tests

on:
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC
  workflow_dispatch:
    inputs:
      rows:
        description: 'Row count for scale tests'
        required: false
        default: '2000000'

permissions:
  contents: read

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run scale and memory tests
        run: >
          mvn -B
          -Dkisoku.runScaleTests=true
          -Dkisoku.scaleRows=${{ github.event.inputs.rows || '2000000' }}
          verify --file pom.xml
